# PR Streams — nginx reverse proxy for a VPS.
#
#   1. Point your domain's A record at this server.
#   2. Save this as /etc/nginx/sites-available/prstreams  and symlink it into
#      /etc/nginx/sites-enabled/ , replacing your.domain.com below.
#   3. Get TLS:   sudo certbot --nginx -d your.domain.com
#   4. In config.env set: FQDN=your.domain.com  HAS_SSL=true  NO_PORT=true
#
# The important bits for large/fast media: proxy_buffering off (stream straight
# through), no request/response size caps, and long timeouts.

server {
    listen 80;
    server_name your.domain.com;

    # Allow arbitrarily large transfers.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;

        # Stream bytes straight through instead of buffering to disk.
        proxy_buffering            off;
        proxy_request_buffering    off;
        proxy_max_temp_file_size   0;

        # Big files / slow clients: don't time out mid-download.
        proxy_connect_timeout   60s;
        proxy_send_timeout      3600s;
        proxy_read_timeout      3600s;
        send_timeout            3600s;
    }
}

# After running certbot, it will add a matching `listen 443 ssl` server block
# automatically and redirect port 80 -> 443.
